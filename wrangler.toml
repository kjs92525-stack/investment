name = "open-terminal"
main = "worker.mjs"
compatibility_date = "2025-09-01"

# Always publish at https://open-terminal.<account>.workers.dev
workers_dev = true
preview_urls = true

# public/ is served as static files; requests with no matching file (/api/*) reach worker.mjs
[assets]
directory = "./public"
binding = "ASSETS"
